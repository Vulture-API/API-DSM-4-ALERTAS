# ---------------------------------------------------------------------------
# SCRUM-377 — Pipeline de Integração Contínua (Equipe Vulture)
#
# Pipeline padrão dos microsserviços Node/TypeScript.
# Para reaproveitar em outro repositório, copie este arquivo como está.
# As etapas seguem o documento "Integração Contínua CI" do Confluence:
#   Lint -> Instalação clean room -> Testes -> Quality Gate 80% -> Build
# ---------------------------------------------------------------------------
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: "24"
  COVERAGE_THRESHOLD: "80"

jobs:
  quality:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências (clean room)
        run: npm ci

      - name: Auditoria de vulnerabilidades críticas
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Checagem de formatação
        run: npm run format
        continue-on-error: true

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Quality Gate de cobertura (DoD 80%)
        id: coverage_gate
        run: |
          SUMMARY="coverage/coverage-summary.json"

          if [ ! -f "$SUMMARY" ]; then
            echo "::error::Relatório de cobertura não encontrado em $SUMMARY."
            echo "Verifique se o reporter 'json-summary' está habilitado no vitest.config.ts."
            exit 1
          fi

          COVERAGE=$(node -p "Math.floor(require('./coverage/coverage-summary.json').total.lines.pct)")
          echo "Cobertura de linhas: ${COVERAGE}%"
          echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"

          if [ "$COVERAGE" -lt "${{ env.COVERAGE_THRESHOLD }}" ]; then
            echo "::error::FALHA: cobertura de ${COVERAGE}% não atinge a DoD (${{ env.COVERAGE_THRESHOLD }}%). Merge bloqueado."
            exit 1
          fi

          echo "::notice::Quality Gate aprovado: ${COVERAGE}% de cobertura."

      - name: Build
        run: npm run build

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Comentar resultado no Pull Request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const coverage = '${{ steps.coverage_gate.outputs.coverage }}' || 'n/d';
            const icon = status === 'success' ? '✅' : '❌';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `${icon} **Pipeline de CI: ${status}**`,
                '',
                `- Cobertura de linhas: **${coverage}%** (mínimo ${{ env.COVERAGE_THRESHOLD }}%)`,
                `- Commit: \`${context.sha.substring(0, 7)}\``,
                `- [Ver execução completa](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join('\n'),
            });

  docker:
    name: Validar build da imagem Docker
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Build da imagem (sem push)
        run: docker build -t ${{ github.event.repository.name }}:ci-${{ github.sha }} .
