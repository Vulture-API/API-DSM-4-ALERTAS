# ---------------------------------------------------------------------------
# SCRUM-377 — Pipeline de Integração Contínua (Equipe Vulture)
#
# Arquivo ÚNICO para todos os repositórios Node/TypeScript do projeto.
# Copie como está; só ajuste APP_DIR se o package.json não estiver na raiz
# (ex.: frontend, APP_DIR: app). Cada etapa se adapta ao que o repo tem:
# scripts ausentes viram aviso, e o Docker só roda se existir Dockerfile.
#
# Etapas (documento "Integração Contínua CI" do Confluence):
#   Instalação clean room -> Lint -> Tipos -> Testes -> Quality Gate 80% -> Build
# ---------------------------------------------------------------------------
name: CI

on:
  pull_request:
    branches: [dev, develop, main]
  push:
    branches: [dev, develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: "24"
  COVERAGE_THRESHOLD: "80"
  APP_DIR: "."
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Instalar dependências (clean room)
        run: npm ci

      - name: Auditoria de vulnerabilidades críticas
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Lint
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "::warning::Sem script 'lint' no package.json — etapa pulada. Configure o ESLint para cumprir a DoD."
          fi

      - name: Checagem de formatação
        continue-on-error: true
        run: |
          if node -e "process.exit(require('./package.json').scripts?.format ? 0 : 1)"; then
            npm run format
          else
            echo "::notice::Sem script 'format' — etapa pulada."
          fi

      - name: Checagem de tipos
        run: |
          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            npm run typecheck
          else
            # Next.js gera tipos de rota (ex.: LayoutProps) antes do tsc.
            if [ -x node_modules/.bin/next ]; then npx next typegen; fi
            npx tsc --noEmit
          fi

      - name: Testes com cobertura
        run: |
          # Garante o provider de cobertura na versão do vitest do projeto,
          # sem exigir que cada repo o declare no package.json.
          VITEST_VERSION=$(node -p "require('vitest/package.json').version")
          if ! node -e "require.resolve('@vitest/coverage-v8/package.json')" 2>/dev/null; then
            npm install --no-save --no-audit --no-fund "@vitest/coverage-v8@${VITEST_VERSION}"
          fi
          npx vitest run --coverage.enabled=true \
            --coverage.reporter=text --coverage.reporter=json-summary --coverage.reporter=lcov

      - name: Quality Gate de cobertura (DoD 80%)
        id: coverage_gate
        run: |
          SUMMARY="coverage/coverage-summary.json"

          if [ ! -f "$SUMMARY" ]; then
            echo "::error::Relatório de cobertura não encontrado em $SUMMARY."
            exit 1
          fi

          COVERAGE=$(node -p "Math.floor(require('./coverage/coverage-summary.json').total.lines.pct)")
          echo "Cobertura de linhas: ${COVERAGE}%"
          echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"

          if [ "$COVERAGE" -lt "$COVERAGE_THRESHOLD" ]; then
            echo "::error::FALHA: cobertura de ${COVERAGE}% não atinge a DoD (${{ env.COVERAGE_THRESHOLD }}%). Merge bloqueado."
            exit 1
          fi

          echo "::notice::Quality Gate aprovado: ${COVERAGE}% de cobertura."

      - name: Build
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "::warning::Sem script 'build' — etapa pulada."
          fi

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.APP_DIR }}/coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Comentar resultado no Pull Request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const coverage = '${{ steps.coverage_gate.outputs.coverage }}' || 'n/d';
            const icon = status === 'success' ? '✅' : '❌';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `${icon} **Pipeline de CI: ${status}**`,
                '',
                `- Cobertura de linhas: **${coverage}%** (mínimo ${{ env.COVERAGE_THRESHOLD }}%)`,
                `- Commit: \`${context.sha.substring(0, 7)}\``,
                `- [Ver execução completa](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join('\n'),
            });

  docker:
    name: Validar build da imagem Docker
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Build da imagem (sem push)
        run: |
          if [ ! -f "${{ env.APP_DIR }}/Dockerfile" ]; then
            echo "::notice::Sem Dockerfile em ${{ env.APP_DIR }} — etapa pulada."
            exit 0
          fi
          # O Docker exige tag em minúsculas; o nome do repositório tem maiúsculas.
          IMAGE="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          docker build -t "$IMAGE:ci-${{ github.sha }}" "${{ env.APP_DIR }}"
